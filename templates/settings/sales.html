<div class="settings-card">

    <h3>Sales Settings</h3>

    <form method="POST"
          action="{{ url_for('save_sales_settings') }}">

        <label>Tax Percentage</label>

        <input type="number"
               name="tax_percentage"
               value="{{ settings.get('tax_percentage', '18') }}"
               min="0"
               max="100"
               step="0.01"
               class="form-control">

        <label>Default Discount (%)</label>

        <input type="number"
               name="default_discount"
               value="{{ settings.get('default_discount', '0') }}"
               min="0"
               max="100"
               step="0.01"
               class="form-control">

        <label>Invoice Prefix</label>

        <input type="text"
               name="invoice_prefix"
               value="{{ settings.get('invoice_prefix', 'INV') }}"
               class="form-control">

        <br>

        <button class="btn btn-primary">

            Save Sales Settings

        </button>

    </form>

</div>
