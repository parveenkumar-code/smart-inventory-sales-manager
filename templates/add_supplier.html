{% extends "base.html" %}

{% block title %}Add Supplier{% endblock %}

{% block content %}

<h2>Add New Supplier</h2>

<p class="text-muted">
    Enter supplier information.
</p>


<div class="card p-4">

    <form method="POST">

        <div class="mb-3">

            <label>Supplier Name</label>

            <input
                type="text"
                name="supplier_name"
                class="form-control"
                required
            >

        </div>


        <div class="mb-3">

            <label>Company Name</label>

            <input
                type="text"
                name="company_name"
                class="form-control"
            >

        </div>


        <div class="mb-3">

            <label>Phone Number</label>

            <input
                type="tel"
                name="phone"
                class="form-control"
            >

        </div>


        <div class="mb-3">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                class="form-control"
            >

        </div>


        <div class="mb-3">

            <label>Address</label>

            <textarea
                name="address"
                class="form-control"
                rows="3"
            ></textarea>

        </div>


        <button type="submit"
                class="btn btn-primary">

            Save Supplier

        </button>


        <a href="{{ url_for('suppliers') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
