{% extends "base.html" %}

{% block title %}Add Product{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Add New Product</h2>

    <p class="text-muted">
        Enter the product information below.
    </p>


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Product Name
            </label>

            <input
                type="text"
                name="product_name"
                class="form-control"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Category
            </label>

            <select name="category"
                    class="form-control"
                    required>

                <option value="">Select Category</option>

                <option>Electronics</option>

                <option>Accessories</option>

                <option>Clothing</option>

                <option>Furniture</option>

                <option>Grocery</option>

                <option>Other</option>

            </select>

        </div>


        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Purchase Price (₹)
                </label>

                <input
                    type="number"
                    name="purchase_price"
                    class="form-control"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Selling Price (₹)
                </label>

                <input
                    type="number"
                    name="selling_price"
                    class="form-control"
                    min="0"
                    step="0.01"
                    required
                >

            </div>

        </div>


        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Available Quantity
                </label>

                <input
                    type="number"
                    name="quantity"
                    class="form-control"
                    min="0"
                    required
                >

            </div>


            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Minimum Stock Alert
                </label>

                <input
                    type="number"
                    name="minimum_stock"
                    class="form-control"
                    min="0"
                    value="5"
                    required
                >

            </div>

        </div>


        <button type="submit"
                class="btn btn-primary">

            Save Product

        </button>


        <a href="{{ url_for('products') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
