{% extends "base.html" %}

{% block title %}Edit Customer{% endblock %}

{% block content %}

<h2>Edit Customer</h2>

<div class="card p-4">

    <form method="POST">

        <div class="mb-3">

            <label>Customer Name</label>

            <input
                type="text"
                name="customer_name"
                class="form-control"
                value="{{ customer.customer_name }}"
                required
            >

        </div>


        <div class="mb-3">

            <label>Phone Number</label>

            <input
                type="tel"
                name="phone"
                class="form-control"
                value="{{ customer.phone or '' }}"
            >

        </div>


        <div class="mb-3">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                class="form-control"
                value="{{ customer.email or '' }}"
            >

        </div>


        <div class="mb-3">

            <label>Address</label>

            <textarea
                name="address"
                class="form-control"
                rows="3"
            >{{ customer.address or '' }}</textarea>

        </div>


        <button type="submit"
                class="btn btn-primary">

            Update Customer

        </button>


        <a href="{{ url_for('customers') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
