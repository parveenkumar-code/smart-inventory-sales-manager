{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Edit Product</h2>

    <p class="text-muted">
        Update product information.
    </p>


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Product Name
            </label>

            <input
                type="text"
                name="product_name"
                class="form-control"
                value="{{ product.product_name }}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Category
            </label>

            <input
                type="text"
                name="category"
                class="form-control"
                value="{{ product.category or '' }}"
            >

        </div>


        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Purchase Price
                </label>

                <input
                    type="number"
                    name="purchase_price"
                    class="form-control"
                    step="0.01"
                    min="0"
                    value="{{ product.purchase_price }}"
                    required
                >

            </div>


            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Selling Price
                </label>

                <input
                    type="number"
                    name="selling_price"
                    class="form-control"
                    step="0.01"
                    min="0"
                    value="{{ product.selling_price }}"
                    required
                >

            </div>

        </div>


        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Quantity
                </label>

                <input
                    type="number"
                    name="quantity"
                    class="form-control"
                    min="0"
                    value="{{ product.quantity }}"
                    required
                >

            </div>


            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Minimum Stock
                </label>

                <input
                    type="number"
                    name="minimum_stock"
                    class="form-control"
                    min="0"
                    value="{{ product.minimum_stock }}"
                    required
                >

            </div>

        </div>


        <button type="submit"
                class="btn btn-primary">

            Update Product

        </button>


        <a href="{{ url_for('products') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
