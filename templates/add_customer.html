{% extends "base.html" %}

{% block title %}Add Customer{% endblock %}

{% block content %}

<h2>Add New Customer</h2>

<p class="text-muted">
    Enter customer information.
</p>


<div class="card p-4">

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Customer Name
            </label>

            <input
                type="text"
                name="customer_name"
                class="form-control"
                required
                maxlength="100"
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Phone Number
            </label>

            <input
                type="tel"
                name="phone"
                class="form-control"
                maxlength="20"
                placeholder="Enter mobile number"
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="example@gmail.com"
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Address
            </label>

            <textarea
                name="address"
                class="form-control"
                rows="3"
                placeholder="Enter customer address"
            ></textarea>

        </div>


        <button type="submit"
                class="btn btn-primary">

            Save Customer

        </button>


        <a href="{{ url_for('customers') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
